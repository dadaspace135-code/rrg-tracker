name: Update crypto data

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      top_n:
        description: "対象とする時価総額の順位"
        required: false
        default: "500"

permissions:
  contents: write

concurrency:
  group: update-crypto-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch crypto data
        env:
          TOP_N: ${{ github.event.inputs.top_n || '500' }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python fetch_crypto.py

      - name: Commit updated crypto.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto.json
          if git diff --cached --quiet; then
            echo "No changes to crypto.json — skipping commit."
          else
            git commit -m "chore: update crypto data ($(date -u +%Y-%m-%d))"
            git push
          fi
